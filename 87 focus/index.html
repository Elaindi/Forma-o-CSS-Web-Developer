<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">        
    <title>Pseudo classes</title>
</head>
<body>
    <h1>Pseudo-classes :focus, :focus-within e :focus-visible</h1>

    <form>
        <p>Faça seu pedido! escolha o sabor do sorvete que voce deseja:</p>
        <label>
            nome completo
            <input type="name" name="sabor" value=""> 
        </label>

        <label>
            sabor do sorvete
            <select name="sabor" id="sabor">
                <option value="chocolate">Chocolate</option>
                <option value="morango">Morango</option>
                <option value="baunilha">Baunilha</option>
                <option value="flocos">Flocos</option>
            </select>
        </label>
        <button type="submit">finalizar pedido</button>
    </form>
</body>
</html>
