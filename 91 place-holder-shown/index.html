<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes  :placeholder-shown</h1>

    <form>
        <label for="name">nome completo</label>
        <input name="name" type="text">
        <br> <br>
        <label for="email">E-mail</label>
        <input name="email" type="email" placeholder="name@exemple.com"
        <br><br>
        <label for="age">Sua idade</label>
        <input name="age" type="number" value="18 " placeholder="voce deve ter 18+ anos"
    </form>
</body>
</html>
