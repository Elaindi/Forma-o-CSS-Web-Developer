<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes :target</h1>

    <h3>table of contents</h3>
    <ol>
        <li><a href="#p1">Pular para o primeiro parágrafo</a></li>
        <li><a href="#p2">Pular para o segundo parágrafo</a></li>
        <li>
            <a href="#nowhere">Esse link não vai para lugar nenhum, pois não existe.</a>
        </li>

    </ol>
    <br>

    <h3>Meu artigo</h3>
    <p id="p1">Lorem ipsum dolor sit amet</p>
    <p id="p2">Consectetur adipiscing elit</p>
</body>
</html>
