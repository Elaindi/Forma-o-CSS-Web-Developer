<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/estilo.css">
    <title>Pseudo-elementos</title>
</head>
<body>
    <h1>Pseudo-elementos - <code>::placeholder</code></h1>
    <p>Um placeholder é uma dica para ajudar no preechimento de algum campo de formulário</p>
    <p>Propriedades aceitas:</p>
    <ul>
        <li>color</li>
        <li>font-family</li>
        <li>font-size</li>
        <li>font-style</li>
        <li>font-weight</li>
        <li>text-decoration</li>
        <li>text-transform</li>
    </ul>
    <hr>
    <p>Exemplo:</p>

   <label for="name">Nome:</label>
   <input type="text" name="name" id="name" placeholder="Digite seu nome">
   <hr>

   <label for ="senha">Senha:</label>
    <input type="password" name="senha" id="senha" placeholder="mínimo 10 caracteres">


</body>
</html>
