<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/estilo.css"> 
    <title>Pseudo elementos</title>
</head>
<body>
   <h1>Pseudo elementos - <code>::file-selector-button</code></h1>
   <p>O pseudo elemento <code>::file-selector-button</code> é usado para estilizar o botão de seleção de arquivos em um elemento <code>&lt;input type="file"&gt;</code>. Ele permite que você personalize a aparência do botão, incluindo cores, fontes, bordas e outros estilos.</p>

   <form>
       <label for="fileUploud">Escolha um arquivo:</label>
       <input name="fileUploud" type="file" id="fileUploud">
   </form>
</body>
</html>
